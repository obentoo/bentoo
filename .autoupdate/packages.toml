exactly what happened: measured 2026-09-01, SBO_VER sat at 1.6.4 while v1.6.5
had been out since 2026-07-07 and the amd64 blob had grown by 576 bytes of new
revocations. Guarded instead by scripts/check-edk2-dbx-freshness.sh — run it
after every bump. Bumping SBO_VER changes the DIST entries, so it needs a
revbump plus a Manifest regeneration, never an in-place edit.
"""
