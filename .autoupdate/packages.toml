["net-misc/nxplayer"]
url = "https://download.nomachine.com/download/?id=43&platform=linux"
parser = "regex"
pattern = 'nomachine-personal-edition_([0-9]+\.[0-9]+\.[0-9]+)_[0-9]+_amd64\.deb'
type = "bin"
aux_var = "MY_BUILD"
aux_pattern = 'nomachine-personal-edition_[0-9.]+_([0-9]+)_amd64\.deb'
version = "10.1.7"
comments = """
nxplayer — NoMachine download page is SSR; regex on the .deb filename gives the
current version (single version on page → deterministic first match).
v10 renomeou o produto gratuito para "Personal Edition": id=1 virou 301 para a
raiz e o .deb passou a ser nomachine-personal-edition_*; id=43 é o sucessor.
O build number (o _N do nome) NÃO deriva do PV e muda entre releases (10.0.57
saiu como _2); por isso vai em MY_BUILD via aux_var. Sem isso o bump troca só o
PV, a URL não existe, e web9001 responde 200 + homepage HTML em vez de 404 —
o fetch "passa" e o unpack morre com "file format not recognized".
"""
# END

