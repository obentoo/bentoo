comments = """
xwayland — the xorg/xserver tag list on gitlab.freedesktop.org, narrowed to the
xwayland axis by the API's own search= filter.

The former endpoint was the official archive directory
(https://xorg.freedesktop.org/archive/individual/xserver/, which www.x.org
redirects to). It stopped answering entirely — measured 2026-08-23, the TCP
connection times out with no response, so the record could not be probed at all.

The repository tags xorg-server-* in the SAME tag space, so a bare ref ranking
would cross version axes. search=xwayland- makes the server drop those before
they are ever sent, and the pattern anchors on the JSON "name" field, so a tag
message that quotes a version cannot leak into the capture. Measured: 100 tags
returned, every one on the xwayland axis, max = 26.0.99.901.

select = "max" is load-bearing, not decoration. The default ordering is by last
update, so select="first" is whatever was touched most recently rather than the
newest version.

Upstream's pre-release axis is X.0.99.90N (21.0.99.901 -> 21.1.0,
22.0.99.901 -> 22.1.0), and it sorts BELOW the release it precedes under Gentoo
rules, so max moves rc1 -> rc2 -> final on its own with no record change. The
overlay is deliberately on that RC axis right now (26.0.99.901, the 26.1.0 rc1),
which is why nothing here filters pre-releases out.

Since the 26 series these tags ship Xwayland ALONE: the other DDX were dropped
upstream and meson_options.txt no longer declares xorg, xnest or xwayland. The
26.0.99.902 bump first failed the options gate on exactly those three, which the
ebuild carried in a dead `[[ ${PV} == "9999" ]]` branch -- the gate reads the
ebuild text and does not evaluate the condition. The branch was removed rather
than made conditional, because the options do not exist on any PV of this axis.
Measured 2026-09-09: meson_options.txt is byte-identical between 901 and 902, so
that failure was never about the new tag.
"""
# END

