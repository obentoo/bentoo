["app-misc/claude-desktop-bin"]
url = "https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages"
parser = "regex"
pattern = 'Version: ([0-9][0-9.]*)'
select = "max"
version = "2.7032.0"
comments = """
Claude Desktop — the Debian "Packages" index of Anthropic's own APT repository,
the one code.claude.com/docs/en/desktop-linux tells users to add. It is a flat
text file: one "Version:" field per package, 44 of them on 2026-09-22 and no
other line containing that word, so select = "max" is exact. The index is NOT
sorted, hence max rather than the default first-match.

This record pointed at https://claude.ai/api/desktop/linux/x64/deb/latest until
2026-09-22, when it started returning Cloudflare's interstitial ("Just a
moment...", HTTP 403) for EVERY User-Agent tried, browser ones included: the
challenge is now a JS one, so no header fixes it. The old record also carried
aux_var = "BUILD_ID" / aux_pattern, because the releases/ filename embedded a
per-build 40-hex hash; the APT pool serves the identical artifacts under a plain
versioned name (sha256 of the 2.2553.1 amd64 .deb verified byte-equal against
the cached distfile), so the ebuild dropped BUILD_ID and this record needs no
auxiliary substitution at all.

The predecessor record warned that "its Packages index lags many releases
behind". That is no longer true — the index's newest entry was 2.2553.1 on
2026-09-22, exactly the ebuild's PV. Re-check the lag if a bump ever looks
suspiciously old, but do not go back to the claude.ai API: it is unprobeable.
The arm64 index (binary-arm64/Packages) tracks the same versions.
"""
# END

["app-misc/tmux"]
url = "https://api.github.com/repos/tmux/tmux/releases/latest"
parser = "json"
path = "tag_name"
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "3.7c"
comments = """
tmux - GitHub release tag, a bare version with no "v" prefix.

Point releases carry a letter suffix (3.7 -> 3.7a -> 3.7b -> 3.7c). That is a
valid Gentoo version component and it sorts in the same order upstream intends,
so the tag needs no rewriting.

releases/latest rather than ranking refs/tags: upstream has historically tagged
release candidates in the same tag space (the ::gentoo ebuild still guards
KEYWORDS with [[ ${PV} != *_rc* ]]), and ranking tags would promote one. No _rc
tag appears in the most recent 100 as of 2026-08-29, but the endpoint costs
nothing and closes the hole permanently.
"""
# END

["app-forensics/aflplusplus"]
url = "https://api.github.com/repos/AFLplusplus/AFLplusplus/releases/latest"
parser = "json"
path = "tag_name"
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "5.03c"
comments = """
AFL++ — GitHub release tag, "v" prefix stripped by the normalizer.

Point releases carry a letter suffix (5.01c -> 5.02c -> 5.03c), the same shape
as app-misc/tmux: a valid Gentoo version component that sorts the way upstream
intends, so the tag needs no rewriting.

releases/latest rather than ranking refs/tags: the 4.x and 5.x tags share one
tag space and upstream has backported to the older series, so ranking tags
would be a coin flip on which series is newest.

A BUMP IS NOT MECHANICAL HERE. The ebuild carries three Gentoo patches in
files/ that ::gentoo distributes as a tarball on dev.gentoo.org/~sam/ — that
tarball stops at 4.35c and none exists for 5.x. They touch GNUmakefile,
GNUmakefile.llvm and GNUmakefile.gcc_plugin, all of which upstream edits every
release, so every bump needs them rebased and re-verified before it ships.
"""
# END

["app-forensics/honggfuzz"]
url = "https://api.github.com/repos/google/honggfuzz/tags?per_page=30"
parser = "regex"
pattern = '"name":\s*"([0-9]+(?:\.[0-9]+)+)"'
select = "max"
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "2.6"
comments = """
honggfuzz - PROBE THE TAGS, AND ONLY THE NUMERIC ONES. Both releases/latest and
tags[0] answer "oss-fuzz": a rolling tag upstream re-points at the OSS-Fuzz
integration branch, last moved 2024-07. Reading either field verbatim would
write "oss-fuzz" into version and every later comparison would be nonsense.

The pattern therefore matches only dotted-numeric tags, which excludes the
rolling one outright, and select = "max" ranks what is left rather than trusting
tag order. 2.6 is the newest real release and has been since 2022.

Because upstream is effectively dormant, treat any movement here as suspicious
rather than routine: check it is a real tagged release before bumping.

A BUMP IS NOT MECHANICAL HERE. files/honggfuzz-bfd-bool.patch adapts
linux/bfd.c to binutils >= 2.44 and touches code upstream would also touch if it
ever resumed. Rebase and rebuild before shipping a bump.
"""
# END

["dev-util/shfmt"]
url = "https://api.github.com/repos/mvdan/sh/releases/latest"
parser = "json"
path = "tag_name"
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "3.14.1"
comments = """
shfmt - the binary is one command of the mvdan/sh repository, so the tag lives
under that name, not under "shfmt". releases/latest returns "vX.Y.Z".

The ebuild patches cmd/shfmt/main.go to bake the version in, because shfmt
reads it from debug.ReadBuildInfo() and a tarball build has none. The patch is
version-specific by name; a bump must refresh it or the build dies on a patch
that no longer applies -- which is the intended failure, louder than a binary
that silently reports "(devel)".
"""
# END

["dev-go/govulncheck"]
url = "https://api.github.com/repos/golang/vuln/tags?per_page=30"
parser = "regex"
pattern = '"name":\s*"v([0-9]+\.[0-9]+\.[0-9]+)"'
select = "max"
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "1.8.0"
comments = """
govulncheck - PROBE THE TAGS, NOT THE RELEASES. golang/vuln stopped publishing
GitHub releases at v1.1.4 (January 2025) while continuing to tag every version;
releases/latest therefore reports a version more than a year stale. That is the
mirror image of the usual trap documented at the top of this file: here ranking
tags is right and the release endpoint is the one that lies.

Pinning v1.1.4 is not merely old, it is broken: its golang.org/x/tools v0.29.0
predates the Go 1.27 AST and PANICS ("unexpected expr: *ast.KeyValueExpr") on
any modern source tree. Measured on four projects, 2026-09-11.

The ebuild patches internal/scan/run.go so the scanner reports its own version;
a bump must refresh that patch.
"""
# END

["net-analyzer/nuclei"]
