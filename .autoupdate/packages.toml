pre-staging the archives into ${S}.  A bump must re-read the cmake/*.cmake
modules and re-pin every URL that moved — upstream bumps these silently inside
a release.  If a pin goes stale the build does NOT fail: CMake falls through to
the network and the sandbox kills it, or worse, on a permissive setup it
succeeds against an unreviewed tree.

Four of those pins are .zip on purpose (kissfft, websocketpp, piper-phonemize,
espeak-ng).  pkgcheck flags TarballAvailable on them; do not act on it.  See the
SRC_URI comment in the ebuild for the verified reason.
"""
