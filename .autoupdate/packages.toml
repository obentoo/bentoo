    system minizip -- so it now lives in
    files/chromium-152-unbundle-minizip-undo-unicode.patch.  Re-check on every
    bump; if copium ships a cr15x- successor, take theirs and delete ours.

Verified this time by actually running the phase: PORTAGE_CONFIGROOT with
FEATURES=unprivileged, `ebuild ... clean prepare`, 21 patches, zero rejects.
That closes the gap this comment names above -- do it on every series jump.

