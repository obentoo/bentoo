["dev-util/nvidia-cuda-toolkit"]
url = "https://developer.nvidia.com/cuda-downloads?target_os=Linux&target_arch=x86_64&Distribution=Fedora&target_version=44&target_type=runfile_local"
parser = "regex"
pattern = 'cuda_([0-9]+\.[0-9]+\.[0-9]+)_'
type = "bin"
version = "13.4.2"
comments = """
nvidia-cuda-toolkit — the cuda-downloads page is SSR; the runfile link carries
the current toolkit version (distro in the query string only changes the
installer, not the CUDA version).

The link used to be "cuda_X.Y.Z_<driver>_linux.run". Since 13.4.1 it is
"cuda_X.Y.Z_linux.run": NVIDIA took the driver out of the local runfile and
sends it to a separate download. The pattern survived the change untouched --
it anchors on the "_" that now belongs to "_linux" -- but the 13.4.1 bump still
failed, because the applier copies the previous ebuild and 13.3.1 built its
SRC_URI from a DRIVER_PV that no longer appears in any name. That variable was
dropped in 13.4.1, so the next bump inherits the new scheme.

Measured 2026-09-09: cuda_13.4.1_linux.run answers 200 (4.2 GB) and is listed in
the official md5sum.txt, while cuda_13.4.1_610.43.02_linux.run answers 404.
"""
# END

["media-gfx/imagemagick"]
enabled = false
disabled_by = "removed 2026-09-25: ::gentoo ships the same 7.1.2.31 with verify-sig; the no-.asc reason behind this fork evaporated -- see comments"
url = "https://api.github.com/repos/ImageMagick/ImageMagick/tags"
parser = "json"
path = "[0].name"
transform = [['-', "."]]
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "7.1.2.31"
comments = """
imagemagick — GitHub tags newest-first ("7.1.2-24"); transform hyphen→dot so it
compares against the ebuild "7.1.2.24" (was SKIP: "not comparable").

Removed 2026-09-25 as redundant with ::gentoo at the same 7.1.2.31. The fork
existed for one reason: no .asc for 7.1.2-31 anywhere (checked 2026-09-05), so
it dropped verify-sig and fetched the GitHub asset plus an R2 mirror. That no
longer holds: download.imagemagick.org/archive/releases/ImageMagick-7.1.2-31.tar.xz.asc
answers 200 with a PGP signature, and ::gentoo verifies it. Everything else that
differed was our copy lagging ::gentoo's in-place revisions (src_test rework,
policy.test.xml, a dropped hardened sed and gcc-13 workaround). Before reviving,
check that mirror://imagemagick still serves the .asc for the new release.

Extension parsers (transform / select / script) — bentoolkit autoupdate.
transform = ordered regex substitutions on the extracted version.
select = "max" picks the highest of several matches (not the first).
parser = "script" runs JS in a headless browser; needs a bentoo built with
  `-tags playwright` and the Playwright browsers installed (else the package
  errors with "script parser support not built").
"""
# END

["dev-games/godot"]
