release carries hundreds of assets, so ?per_page=30 answers 13.7 MB and the
checker refuses it — "response body too large: limit 10485760 bytes". Even
per_page=10 is 4.3 MB for only three versioned tags. /tags is 41 KB for 100
tags, 98 of them versioned.

Known limit of reading tags: a tag exists the moment it is pushed, so a bump can
be proposed before upstream publishes the matching release. Harmless here —
the tarball is generated from the tag, so it is fetchable as soon as the tag is.
