["dev-lang/dart@stable"]
url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
parser = "regex"
pattern = '"channel": "stable",\s+"version": "[0-9.]+",\s+"dart_sdk_version": "([0-9.]+)"'
series = '^3\.13\.4$'
version = "3.13.4"
comments = """
Dart (the line dev-lang/flutter can actually run) — "@stable" here is the
OVERLAY's stable, not the Dart channel's: 3.14.0 and up are masked in
profiles/package.mask, so 3.13.4 is the only version anyone can install, and it
is the one flutter-3.47.5-r1 pins with ~dev-lang/dart-3.13.4. That pin is the
ABI of bin/cache/flutter_tools.snapshot, not caution; read the mask entry.

The source is deliberately Flutter's release index and not the Dart archive:
this ebuild exists to serve Flutter, so it must follow the dart_sdk_version of
the newest STABLE Flutter release — the same newest-first file the
dev-lang/flutter record parses, one field further in.

series is an EXACT match, and that is the safety mechanism, not decoration. The
probe can only ever report "up to date" (3.13.4) or fail loudly ("outside this
entry's series"); it can never report a bump. An auto-apply here would `git mv`
this ebuild away and leave flutter with an unsatisfiable dependency. When the
check does go red, Flutter has moved to a new Dart: bump dev-lang/flutter first,
then this ebuild, then raise this series/version and the package.mask floor
together.

That is not hypothetical any more -- it has fired twice, on 2026-09-10 and
again on 2026-09-19 (Flutter stable 3.47.5 carrying dart_sdk_version 3.13.4).
Answering "n" to the --llm fix prompt is the correct move every time: the fix it
offers is to widen the series, which is the one edit that disarms this entry.
The red is the notification, not the bug.

What the red means in practice, both times: .autoupdate had ALREADY bumped
dev-lang/flutter to the new release, carrying the previous release's
~dev-lang/dart pin. That defect is silent -- "emerge -pv" stays green and only
the flutter binary fails, at runtime, with "Wrong full snapshot version". So the
promotion is three edits in one commit, in this order: revbump flutter with the
pin re-derived from dart_sdk_version, copy the dart ebuild to the new PV (and
drop the superseded one, which no longer has a consumer), then raise the series
and version here.

Its other job is to give the ebuild Flutter runs an OWNER. A sweep deletes any
ebuild no entry claims, which is exactly what happened to 3.13.2 on 2026-09-03
(d72f93009), two days after 62eeeb58d had restored it — the mask does not
protect a file from `bentoo overlay autoupdate --clean`, only a claim does.
"""
# END

["dev-lang/dart@testing"]
hold = true
url = "https://storage.googleapis.com/dart-archive/channels/stable/release/latest/VERSION"
parser = "json"
path = "version"
version = "3.13.4"
comments = """
Dart (upstream's own stable channel) — official VERSION manifest. It is
"@testing" because the overlay MASKS what it tracks: anything at or above the
package.mask floor is unusable until a Flutter release ships it, so the ebuild
sits in the tree ahead of dev-lang/flutter rather than in front of users.

No series on purpose — this entry follows upstream wherever it goes (3.14.0,
3.14.1, …) and always resolves to the DIRECTORY'S HIGHEST ebuild.

hold is on because that resolution is not ownership. selectCurrentEbuild picks
the highest PV in the package directory and never consults the other record's
claim, so the two entries stay separate only while dart@stable's version is
strictly below this one. On 2026-09-10 Flutter stable 3.47.3 reached Dart
3.13.3 and dart@stable was promoted onto it — the same ebuild this entry
resolves to. It happened again on 2026-09-19 with 3.47.5/3.13.4, so the
convergence is the RULE, not an accident: both records follow the same upstream
whenever Flutter has caught up. Unheld, upstream's next Dart would make this
entry `git mv` dart-3.13.4.ebuild out of the tree and leave flutter
unsatisfiable: exactly the incident of 1693e3c57, which is what created this
pair in the first place.

hold is the right shape for that and not a workaround: a held entry is still a
claim, so `autoupdate --clean` will not delete the ebuild, and the signal that
actually matters is not lost — dart@stable fails loudly the moment Flutter
moves, which is the only moment a new Dart may enter the tree.

Release it when the directory again holds a Dart ABOVE the one dart@stable
claims. Create that one by COPYING the current ebuild (`cp`), never by letting
the applier move it -- moving it is the failure this hold exists to prevent.
"""
# END

