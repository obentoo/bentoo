already spends 73 there. search=^v6 filters server-side; select=max because
GitLab does not order tags by version. The closing quote in the pattern drops
the -rc1 tag that every release carries. When KF moves to 7.x this pattern
freezes on purpose: a :7 category would be a different set of ebuilds.
"""
