["dev-build/gn"]
hold = true
url = "https://deps.gentoo.zip/dev-build/gn/"
parser = "regex"
pattern = 'gn-([0-9][0-9.]*)\.tar\.xz'
select = "max"
version = "0.2501"
comments = """
gn — deps.gentoo.zip lists tarballs in ascending order; select=max picks the
highest (was SKIP: assumed git-only, but the mirror does host versioned tarballs).

hold = true ON PURPOSE, and the probe means the OPPOSITE of a bump signal.
Upstream publishes commits, never releases, so PV is 0.<count> from
`git describe ${GN_COMMIT} --abbrev=12 --match initial-commit` and somebody must
package the snapshot. This overlay generates and hosts its own (SRC_URI points at
distfiles.obentoo.org; the recipe and the pinned commit are in the ebuild), so a
bump is never a plain PV swap — the tarball has to be built and uploaded FIRST,
and an auto-bump would commit an ebuild whose SRC_URI 404s. Do not remove hold.

THE RETIRE CHECK IS MANUAL. Say plainly what hold costs, because the previous
wording promised a signal that cannot fire: a held record is SKIPPED by bulk
`--check`, so nothing here ever reaches the pending queue on its own. The one
invocation that would fire it, `--check dev-build/gn --force`, is unsafe on this
host — it enqueues into ~/.config/bentoo/autoupdate/pending.json, which an
external timer applies to the working tree, so the check would mutate the tree
it is checking. Reproduce the record's own fetch instead:

  curl -sS "https://deps.gentoo.zip/dev-build/gn/" \\
    | grep -oE 'gn-[0-9][0-9.]*\\.tar\\.xz' | sort -V | tail -1

WHEN: at every dev-build/gn bump (you are already in this package), and whenever
a chromium/dawn build needs a gn newer than the one hosted here.
WHAT IT MEANS: while that number is BELOW our PV, ::gentoo is still behind and
the self-hosting stays. Once it reaches or passes our PV, the self-hosting can be
retired — drop GN_COMMIT and the recipe, point SRC_URI back at deps.gentoo.zip,
and this record goes back to being an ordinary bump signal with hold removed.
LAST OBSERVED 2026-08-03: 0.2374 against our 0.2501 — vercmp = -1, still behind.
"""
# END

["app-office/libreoffice@stable"]
url = "https://downloadarchive.documentfoundation.org/libreoffice/old/"
parser = "regex"
pattern = 'href="([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)/"'
select = "max"
series = '^26\.8\.'
version = "26.8.0.3"
comments = """
libreoffice (stable line) — old/ lists every 4-segment release directory of every
release line, so series pins this entry to 26.8.x and select=max takes the newest
within it.

26.8.0 was released in week 35 of 2026 — RC3 was promoted unchanged, which is why
the final tarball is still named libreoffice-26.8.0.3.tar.xz — so this line lost
its _pre marker on 2026-08-26. The 26.2 line is no longer tracked: it reaches EOL
on 2026-11-30 and the overlay keeps 26.2.6.1 frozen until that ebuild is dropped.

PROMOTION IS INVISIBLE TO THIS PROBE. old/ lists build directories, and upstream
creates none when it promotes an RC to final; the only signal is
download.documentfoundation.org/libreoffice/stable/ starting to list the release.
Whoever repoints series must read stable/ by hand — see @testing for the full
procedure.
"""
# END

["app-office/libreoffice@testing"]
enabled = false
disabled_by = "no 27.2 build published yet — re-enable when old/ first lists a 27.2.x directory (alpha1 due around week 47 of 2026)"
url = "https://downloadarchive.documentfoundation.org/libreoffice/old/"
parser = "regex"
pattern = 'href="([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)/"'
select = "max"
suffix = "_pre"
series = '^27\.2\.'
comments = """
libreoffice (testing line) — same index as @stable, repointed to 27.2.x on
2026-08-26, when 26.8.0 was released and the 26.8 records were promoted. Disabled
until upstream publishes the first 27.2 build: there is no ebuild to mirror, so no
version is recorded either.

Upstream numbers a testing release exactly like a final one (old/ carries
26.8.0.1, .2 and .3 whether they are RCs or the release), so suffix marks it _pre:
Gentoo sorts _pre below the bare version, which keeps the ebuild honest while the
line is in RC. The ebuild strips the marker for SRC_URI via MY_PV="${MY_PV/_pre/}".

THE _pre DOES NOT FALL OFF BY ITSELF. This comment used to claim the marker "makes
the bump fire the moment upstream promotes the release" — it does not. The archive
index gains no new directory when an RC becomes the release, so the probe sees
nothing change and the ebuild keeps a _pre it no longer deserves. Promotion shows
up in exactly two places: a new directory under
download.documentfoundation.org/libreoffice/stable/, and the schedule on
wiki.documentfoundation.org ReleasePlan/<series> — readable through api.php only,
the article itself is behind Anubis. Check those, then drop suffix here, repoint
@stable, and rename the ebuilds.
"""
# END

["app-office/libreoffice@legacy"]
hold = true
url = "https://downloadarchive.documentfoundation.org/libreoffice/old/"
parser = "regex"
pattern = 'href="([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)/"'
select = "max"
series = '^26\.2\.'
version = "26.2.6.1"
comments = """
libreoffice (legacy line) — this record exists to GIVE THE 26.2.6.1 EBUILD AN
OWNER, and for nothing else. Without it no entry claims that ebuild, so
`bentoo overlay autoupdate --clean` lists it for deletion and the only thing
holding the sweep back is the missing version pin on @testing — an accidental
guard that evaporates the day 27.2 ships and @testing is re-enabled with a pin
of its own.

hold, NOT enabled = false: the ebuild IS in the overlay, and enabled is
bookkeeping the checker flips by itself, so a false there gets reverted. hold is
the maintainer decision "present, never auto-bump", which is exactly the intent
here — the 26.2 line still receives point releases until it reaches EOL on
2026-11-30, and the overlay deliberately keeps 26.2.6.1 frozen instead of
following them.

The fields mirror @stable so the record still probes correctly if the hold is
ever lifted; series pins it to the line this ebuild belongs to. DELETE THIS
RECORD when the 26.2.6.1 ebuild is dropped after EOL: a record claiming a
version the overlay no longer ships is worse than no record at all.
"""
# END

