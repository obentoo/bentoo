["sys-kernel/linux-firmware"]
enabled = false
disabled_by = "removed 2026-09-16: ::gentoo reached the same PV 20260916, so the pinned-commit mirror stopped being ahead -- see comments"
url = "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/atom/?h=main"
parser = "regex"
pattern = '<updated>([0-9]{4}-[0-9]{2}-[0-9]{2})'
transform = [['-', ""]]
patched = """
Fetched with git-r3 from the pinned EGIT_COMMIT instead of ::gentoo's release \
tarball: the gitlab archive ::gentoo falls back to is unreachable behind \
Cloudflare, so there is no SRC_URI and no Manifest here. KEYWORDS is also \
narrowed to ~amd64 ~arm64, and src_unpack is unconditional git-r3 rather than \
::gentoo's tarball/9999 branch. Drop this once a tagged ::gentoo release we \
would actually ship fetches on its own.\
"""
aux_var = "EGIT_COMMIT"
aux_pattern = 'id>urn:sha1:([0-9a-f]{40})'
version = "20260916"
comments = """
linux-firmware — kernel.org's cgit atom feed, because this package has no
releases to track: it is fetched with git-r3 from a pinned commit and versioned
by that commit's date (PV=YYYYMMDD), with no SRC_URI and no Manifest.

The pattern takes the newest commit date and the transform strips the dashes to
match PV.  aux_var carries the other half: EGIT_COMMIT must move WITH the date,
or the ebuild claims a date it does not ship — the same class of silent
mismatch that shipped a wrong source tree for sci-ml/ik_llama-cpp before its
SHA variable was wired up.

aux_pattern runs against the raw feed, where the first urn:sha1 is the newest
commit — the same entry the first <updated> came from.  If kernel.org ever
reorders the feed, these two would describe different commits; check that they
agree before applying.

Removed 2026-09-16, and the reason is convergence rather than redundancy. The
whole point of this ebuild was to sit AHEAD of ::gentoo: they publish dated
snapshots, we cut our own between them from a pinned EGIT_COMMIT. ::gentoo now
ships linux-firmware-20260916, the same PV we had, so the gap the mirror
existed to fill closed on that date.

The two ebuilds are NOT interchangeable, which is why this is a decision and
not housekeeping. Ours inherits git-r3 and fetches the exact commit from
kernel.org, with no SRC_URI and no Manifest, because the gitlab archive tarball
::gentoo falls back to is unreachable behind Cloudflare. Theirs is a release
tarball. Choosing ::gentoo means accepting their cadence: no more same-day
firmware, only their dated snapshots.

Re-enable this record the moment a firmware fix you need lands upstream and
::gentoo has not cut a snapshot for it yet. Everything needed is preserved
above -- the atom feed, the date pattern, and the aux_var/aux_pattern pair that
keeps EGIT_COMMIT moving with PV. Restore the ebuild from the commit that
deleted it rather than writing a new one; the src_unpack there is already the
unconditional git-r3 form, which ::gentoo's tarball/9999 branch is not.
"""
# END

["sys-apps/pnpm"]
url = "https://registry.npmjs.org/pnpm"
parser = "json"
path = "dist-tags.latest"
version = "12.6.0"
comments = """
pnpm — npm package, stable channel. dist-tags.latest is the RIGHT endpoint and
must stay: pnpm promotes through next-<major> first, and that channel carries
pre-releases (next-12 was 12.0.0-beta.3 on 2026-08-03), so probing next-11 would
eventually report a beta as current.

THIS PACKAGE HAS FIVE DISTFILES SINCE 12.0.0, AND A BLIND BUMP BREAKS IT.
pnpm 12 moved the implementation from a JavaScript bundle to a native Rust
binary and stopped shipping it in the "pnpm" tarball; that tarball is now a
wrapper whose only route to a binary is downloading one at first use. The
ebuild therefore also fetches @pnpm/exe.linux-{x64,arm64}[-musl] as distfiles,
one per ARCH/ELIBC pair.

The 11.25.0 -> 12.3.4 bump (d203c5705) copied the old ebuild across that
boundary and produced a package that failed in src_install on a dangling
symlink -- bin/pnpm.cjs had become bin/pnpm.mjs -- which is the good outcome.
The bad one was already in reach: had the symlink resolved, the wrapper would
have been merged and would have downloaded its own binary into /usr on first
run.

BEFORE ACCEPTING A BUMP, confirm all four platform packages exist at the new
version -- they are published as optional dependencies of the wrapper and are
not guaranteed to be republished in lockstep:

  for p in exe.linux-x64 exe.linux-x64-musl exe.linux-arm64 exe.linux-arm64-musl; do
    printf '%s: ' "$p"
    curl -sfI "https://registry.npmjs.org/@pnpm/$p/-/$p-<PV>.tgz" | head -1
  done

Four 200s and the SRC_URI follows ${PV} on its own. Anything else means the
bump has to wait, not that a URL needs editing.

Re-read the wrapper on any MAJOR bump. What is packaged here is upstream's
install.js reproduced at merge time (native binary over the placeholder bin,
download path deleted); a rearchitecture like 11 -> 12 invalidates it silently.
"""
# END

