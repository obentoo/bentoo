["media-libs/libopenshot"]
url = "https://api.github.com/repos/OpenShot/libopenshot/releases/latest"
parser = "json"
path = "tag_name"
transform = [['^v', ""]]
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "1.0.0"
comments = """
libopenshot — releases/latest; tag_name is "vX.Y.Z", transform strips the v.
Verified by real download on 2026-09-01: tag_name "v1.0.0", published
2026-08-30.

Releases in lockstep with libopenshot-audio and openshot-qt; bump the three
together.

Two things a bump MUST re-verify by hand, because the applier only rewrites the
version and both failures are silent:

1. PROJECT_SO_VERSION (31 today) backs SLOT="0/31".

2. The two patches in files/ are version-named, so the applier will NOT rename
   them and the ebuild will die on a missing FILESDIR entry -- which is the good
   outcome.  The bad outcome is renaming them without re-testing.  Both encode
   upstream state that a release can change:
   - guard-tracked-object-mask: EffectBase::TrackedObjectMask() calls
     TrackedObjectBBox methods without the #ifdef USE_OPENCV guard that
     Clip.cpp and Timeline.cpp have.  Since TrackedObjectBBox.cpp only enters
     the build via OPENSHOT_CV_SOURCES, USE=-opencv otherwise yields a
     libopenshot.so with undefined symbols (verified with nm -DC) and every
     downstream link fails.  Upstream bug; drop the patch when it lands there.
   - opencv5-cxx20: this overlay ships media-libs/opencv-5.0.0 and opencv is
     SLOT="0/${PV}", so 4 and 5 cannot coexist -- upstream's
     find_package(OpenCV 4) rejects the 5.  The patch also raises
     CMAKE_CXX_STANDARD to 20, which abseil/protobuf 7.x requires; note that
     -DCMAKE_CXX_STANDARD=20 on the command line does NOT work, the set() in
     CMakeLists.txt wins.  Beware the diagnosis trap: in C++17 the abseil
     headers fail to parse and emit ~690 errors that read as OpenCV errors
     ("cv::boundingRect is not a member").  Fix the standard first.
"""
# END

