meta = { fetch_method = "post", fetch_url = "https://www.blackmagicdesign.com/api/register/us/download/{id}", fetch_body = "json", fetch_response = "url", fetch_content_type = "application/zip", fetch_min_bytes = "3000000000", fetch_filename = "DaVinci_Resolve_{version}_Linux.zip", fetch_form = "product=DaVinci+Resolve&platform=Linux&policy=true&origin=www.blackmagicdesign.com", fetch_form_env = "country=BMD_COUNTRY&firstname=BMD_FIRSTNAME&lastname=BMD_LASTNAME&email=BMD_EMAIL&phone=BMD_PHONE&street=BMD_STREET&city=BMD_CITY&state=BMD_STATE&zip=BMD_ZIP", fetch_timeout = "1800", fetch_id_url = "https://www.blackmagicdesign.com/api/support/us/downloads.json", fetch_id_pattern = '"Linux":\[\{"releaseId":"[0-9a-f]+","downloadId":"([0-9a-f]+)","downloadTitle":"DaVinci Resolve {version}"' }
version = "21.1.0-r2"
comments = """
davinci-resolve — Blackmagic's own version endpoint, the only machine-readable
source they publish.  It answers with the release split across three integer
fields rather than a version string:

  {"linux":{"releaseId":"…","downloadId":"…","major":21,"minor":1,
            "releaseNum":0,"build":14}}

so parser=json cannot reach it — no single path holds the answer.  The regex
captures the three numbers TOGETHER, separators and all, as one capture group
('21,"minor":1,"releaseNum":0'), and the two transform rules rewrite those
separators into dots to yield 21.1.0.  Verified against the live endpoint on
2026-09-09.  The trailing "build" field is upstream's respin counter and is
deliberately outside the capture: it moves without a release.

HOLD survives the [meta] block below, but NOT for the reason it was first
written.  The original one is gone: the applier can now download the archive
and regenerate the Manifest, which is exactly what fetch_* buys.  What remains
is the file NAME.  The ebuild builds it from ${PV%.0}, correct only while the
third component is zero — upstream calls this release "21.1", not "21.1.0".  A
hypothetical 21.1.1 keeps all three components, so an unheld record would bump
the PV and then fetch, digest and publish under a name that release does not
use.  The archive would be real and the Manifest self-consistent; the package
still could not merge.  A human has to re-check the file name shape at every
bump, and hold is what stops one from happening without that.

The download is no longer a manual curl: the [meta] block above performs it.

  bentoo distfile fetch media-video/davinci-resolve --version 21.1

That command reads /var/db/repos/bentoo, NOT the checkout it runs from —
measured 2026-09-19, from a worktree carrying this very record: the answer was
"this package configures no authenticated distfile fetch", because the synced
copy still held the record without it.  So a change here reaches the command
only after commit + push + `emaint sync -r bentoo`, the same rule the ebuilds
follow.  Editing the record and testing in place will report a record that is
right as broken.

--version IS REQUIRED and it is the TWO-component version, not this record's
`version`.  The ebuild names the archive after ${PV%.0}
(DaVinci_Resolve_21.1_Linux.zip) while the record tracks the three-component
21.1.0, and BOTH fetch_filename and fetch_id_pattern resolve against whatever
{version} is given.  Passing 21.1.0 would look up a downloadTitle that does not
exist and, if it somehow matched, would write a file name the Manifest does not
carry.  Verified end to end on 2026-09-19 against DaVinci Resolve 21.1.

How the two endpoints chain, and why the id is not hardcoded: Blackmagic mints
a fresh downloadId per release AND per platform, so fetch_id_url +
fetch_id_pattern read it out of the public catalogue at fetch time and
substitute it into {id}.  The pattern is anchored on "Linux" and on the release
title together, because all four platforms share one downloadTitle.  Note this
is a DIFFERENT id from the one in the download page's own URL, which is the
releaseId and posts to the wrong endpoint.

The reply to that POST is 492 bytes of text/plain holding a signed CloudFront
URL that expires in three hours — not the archive.  fetch_response = "url" is
what turns it into a second request; without it the URL itself would be written
as the "zip" and digested into a green Manifest.  fetch_content_type and
fetch_min_bytes are the belt to that brace.

THE IDENTITY IS NOT IN THIS FILE.  The vendor gates the download behind a
registration form — name, e-mail, telephone, address — and this file is public.
fetch_form_env therefore records only the VARIABLE NAMES; each value is
resolved at fetch time from the environment, then ~/.config/bentoo/secrets,
then /etc/bentoo/secrets, so every operator sends their own details.  Set them
once:

  # ~/.config/bentoo/secrets   (chmod 600)
  BMD_COUNTRY=…           # ISO 3166-1 alpha-2, lowercase ("br", "us")
  BMD_FIRSTNAME=…
  BMD_LASTNAME=…
  BMD_EMAIL=…
  BMD_PHONE=+55…          # E.164
  BMD_STREET=…
  BMD_CITY=…
  BMD_STATE=…             # spelled as the vendor's own list spells it ("São Paulo")
  BMD_ZIP=…               # CEP, no punctuation

A missing one is reported before any request goes out, naming both the variable
and the field it belongs to.  What stays in fetch_form is only what identifies
the DOWNLOAD and not the person: product, platform, policy and the origin the
vendor's own page injects.

country is in the env list rather than the form for the same reason as the
rest, and it is easy to get wrong: it looks like a property of the package
(this record was first written with a literal "country=br") but it is a
property of whoever submits the form.  The ebuild's pkg_nofetch points USERS at
this command, so a literal here would register every one of them from the
maintainer's country.

fetch_timeout is 1800 because the default is 300: 3.81 GiB cannot arrive inside
five minutes below ~13 MB/s, and a link slower than that would fail every time
on a download that was working.
"""
# END

