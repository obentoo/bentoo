IS the ebuild's versioning scheme (0_pre<YYYYMMDD>).

track = "commit" is what makes this auto-appliable, and it replaced hold = true
on 2026-07-26.  Two things had to be true for that, and neither was before:
  - the ebuild's SHA must live in a variable the commit applier rewrites, so
    MY_COMMIT was renamed to GIT_COMMIT.  Under the old name --apply moved the
    date and left the SHA behind: 0_pre20260725 shipped the 2026-07-18 tree
    under a renamed distfile — no 404, no error, just the wrong source.
  - the "0_pre" prefix must come from the snapshot suffix the checker carries
    over from the current PV, NOT from a transform.  A third transform rule
    ('^(\\d+)$' -> "0_pre$1") would compose with it and yield "0_pre0_pre<date>".
"""
# END

