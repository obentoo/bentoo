hold = true
url = "https://invent.kde.org/api/v4/projects/plasma%2Fpowerdevil/repository/tags?search=^v6&per_page=100"
parser = "regex"
pattern = '"name":"v([0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)"'
select = "max"
headers = { "User-Agent" = "bentoo-autoupdate" }
series = '^[0-9]+\.[0-9]+\.(?:[0-9]|[1-8][0-9])(?:\.[0-9]+)?(?:-r[0-9]+)?$'
version = "6.7.5-r3"
comments = """
powerdevil -> plasma/powerdevil. Temporary mirror of ::gentoo's 6.7.5-r2 plus
one patch, NOT a package bentoo intends to carry.

::gentoo's -r2 added powerdevil-6.7.5-patchset-1, whose cherry-pick of upstream
57f190459 (KDE-bug #523281) is half a change: it prefixes the brightness
applet's controls with "dialog." but omits the companion commit declaring them
as properties on PopupDialog. The prefix resolves to undefined, so every drag
of the brightness slider dies on a TypeError and the display never dims. The
overlay ebuild drops the prefix; files/ carries the reasoning.

hold = true because the patch is pinned to 6.7.5: on any later tag it applies
to code that no longer needs it, and the fix is already complete upstream from
6.7.6 on. So this record does not bump -- it reports, and the report IS the
exit condition. The moment it calls 6.7.6, delete this package and this record
goes enabled = false; there is nothing bentoo-specific left to keep.

Probed on invent.kde.org rather than api.github.com/repos/KDE: the GitHub
token-less cap is 60 req/h and kde-plasma already overspends it (see
kde-frameworks/attica). select = "max" + series, never [0].name, because
Plasma numbers the next series' beta x.y.90 -- v6.7.90 IS the 6.8 beta and
sorts first; kde-plasma/plasma-firewall carries the full account of what a
revival onto such a beta breaks.
"""
# END

["kde-plasma/spectacle"]
url = "https://api.github.com/repos/KDE/plasma-workspace/tags?per_page=20"
parser = "regex"
pattern = '"name":"v([0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)"'
select = "max"
headers = { "User-Agent" = "bentoo-autoupdate" }
patched = """
Applies files/spectacle-opencv5.patch, which ::gentoo does not ship at 6.7.4 — \
it carries no files/ directory for this package at all — and adds a \
pkg_postinst calling xdg_pkg_postinst (xdg is already inherited). The patch is \
named ${PN}-opencv5.patch, not ${P}-, deliberately: it has been byte-identical \
since 6.7.1, and a version in the filename would make every bump rename it by \
hand. Drop this once ::gentoo carries the opencv5 fix itself.\
"""
series = '^[0-9]+\.[0-9]+\.(?:[0-9]|[1-8][0-9])(?:\.[0-9]+)?(?:-r[0-9]+)?$'
version = "6.7.5-r1"
comments = """
spectacle -> KDE/plasma-workspace (anchor: overlay versions it as Plasma).

`series` excludes the BETAS. Plasma numbers the next series' beta as x.y.90 /
x.y.91 -- 6.7.90 IS the 6.8 beta -- and `[0].name` over the tag list always
returns the newest tag, beta included. On 2026-09-10 that bumped spectacle to
6.7.90 and broke emerge: the ebuild derives its Plasma-family deps from
${KDE_CATV} (== ${PV}), so it asked for >=kde-plasma/kpipewire-6.7.90 -- and
bentoo does not carry kpipewire, it comes from ::gentoo, which was at 6.7.5. No
ebuild satisfies the dep, so the package becomes uninstallable. Hence
`parser = "regex"` + `select = "max"` instead of `[0].name`: the regex matches
EVERY tag, `series` drops any third component >= 90, and `max` picks the highest
remaining stable. Once Plasma 6.8.0 ships as stable it matches the series on its
own and the record moves again.

THE TRAILING `(?:-r[0-9]+)?` IS NOT DECORATION. `series` is matched against the
version as it appears in the ebuild FILENAME -- revision included -- so an
anchored regex without it puts a revbumped ebuild outside its own line. That is
not hypothetical: the 6.7.5 -> 6.7.5-r1 revbump in 43e3f0617 made every sweep
fail with ErrSeriesNotFound, and that error is deliberately not auto-disabling,
so the package simply stopped being checked until this was fixed. Any series
regex in this file that anchors on `$` needs the same allowance.
"""
# END

