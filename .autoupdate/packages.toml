headers = { "User-Agent" = "bentoo-autoupdate" }
version = "1.38.1-r1"
comments = """
minikube — GitHub releases/latest -> tag_name "vX.Y.Z" ("v" stripped).
Live-verified 2026-08-20: v1.38.1, which is what the overlay ships.

hold = true, for two reasons that both break an unattended bump:

  1. The ebuild pulls a SECOND distfile, ${P}-deps.tar.xz, from
     dev.gentoo.org/~zmedico/dist/ -- a vendored Go module tree that a Gentoo
     developer generates by hand, per version. It is not published on the
     upstream release, so a tag can be live for days with no deps tarball
     behind it, and pkgdev manifest would then fail on a 404. Confirm with
     `curl -sI https://dev.gentoo.org/~zmedico/dist/minikube-<PV>-deps.tar.xz`
     before bumping.
  2. GIT_COMMIT= is hardcoded to the commit the tag points at, and feeds
     `minikube version`. The applier rewrites PV and SRC_URI, not a free-text
     ebuild variable, so a bump that only moves the version ships a binary
     reporting the PREVIOUS commit. Read it from
     `/repos/kubernetes/minikube/git/ref/tags/v<PV>` -> object.sha.

Note that hold only stops the checker from proposing the bump; an explicit
--apply still rewrites the ebuild. See feedback on hold not being enforced on
apply.

This overlay carries the package (::gentoo has it too) because ::gentoo's
1.38.1 does not build with USE=libvirt: it still asks make for the
out/docker-machine-driver-kvm2 target that 1.38 deleted along with
cmd/drivers/kvm. Drop this package from the overlay once ::gentoo fixes it.
"""
# END

["dev-python/tree-sitter"]
