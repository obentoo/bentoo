headers = { "User-Agent" = "bentoo-autoupdate", "Accept" = "application/vnd.github.raw" }
version = "1.23.0_pre20260925"
comments = """
zed — commit-tracked on main; _pre suffix preserved from current ebuild.
2026-08-06: 2 commits landed same UTC day (d61e80b -> 6b2aa1c), so the date
component alone did not change; bumped as -r1 (same-day revision) instead.
2026-08-07: same again (cc053a4 -> 38ca910), so -r1 once more. Manual bump; the
base version stayed 1.16.0 and only 5 crates moved (ctor, link-section,
linktime-proc-macro, pathfinder_simd).
2026-08-17: raw.githubusercontent.com started answering 429/503 (rate limit),
tripping the circuit breaker on the base-version fetch. Same file now comes from
the contents API on api.github.com — the host the commit probe already uses —
with Accept: application/vnd.github.raw, which returns the file verbatim (the
default media type would be base64 and the pattern would never match). The
commits endpoint ignores that Accept, so the main probe is unaffected.
2026-08-18: async-tar moved from crates.io to a zed-industries git fork, so it
left CRATES for GIT_CRATES. It needs no src_prepare sed: those nine seds exist
only for the [patch.crates-io] entries, which cargo.eclass does not rewrite.
Patch 0002 needed a context rebase in crates/zed/Cargo.toml (upstream reordered
channel/chrono).
2026-08-20: the applier rewrote EVERY 40-hex commit in the ebuild with the new
EGIT_COMMIT, not just EGIT_COMMIT itself, so the seven `local *_COMMIT` values in
src_prepare (async-process, async-task, calloop, livekit, windows-capture,
notify, tree-sitter) all became the zed commit. Measured on the released
1.18.0_pre20260819: only 1 of the 11 [patch.crates-io] lines got rewritten to a
path (calloop, whose pattern carries no rev), leaving 10 pointing at git — cargo
then needs the network and src_compile dies. Those seven are the rev= of the
git-deps, i.e. the commit column of GIT_CRATES; they must be re-derived from
Cargo.lock on every bump, never sed-ed from EGIT_COMMIT.
2026-08-23: the same rewrite happened again on 1.18.0_pre20260823 and reached
origin/master. The applier is still unfixed, so assume every future zed bump
lands with the seven values wrong and re-derive them by hand. Measured this
time: 9 of the 10 [patch.crates-io] entries kept `git =`, and `cargo metadata
--offline` died with "can't checkout from
https://github.com/zed-industries/async-process.git: you are in the offline
mode" - i.e. src_compile cannot work in the network-less sandbox. Fixed as -r1
(not in place) because the ebuild was already published; SRC_URI names the
tarball after ${PF}, so -r1 also renames the DIST entry.
2026-08-25: a different applier defect, on 1.18.0_pre20260825 (0969b0db). The
seven src_prepare commits were left alone this time, but CRATES and GIT_CRATES
were copied verbatim from the previous ebuild while upstream's Cargo.lock had
moved: wasmtime 36.0.14 -> 48.0.1 (plus cranelift 0.123 -> 0.135, regalloc2
0.12 -> 0.15, the wasm-tools 0.236/0.252 -> 0.254 set) and tree-sitter
dff1fd86 -> 43623ec9. Offline cargo would fail on the first missing crate. The
lesson generalises: the applier only ever edits EGIT_COMMIT and version, so any
bump whose Cargo.lock changed needs pycargoebuild re-run and its CRATES /
GIT_CRATES blocks transplanted -- diff Cargo.lock between the old and new
commit to know whether that is needed. Fixed as -r1 on f42c6e87, whose
Cargo.lock is byte-identical to 0969b0db's, so the regenerated blocks are
correct for both.
2026-08-26: manual bump ac099b4a -> fc9258b4, both committed on the same UTC
day (14:53 -> 18:21), so it lands as -r1. livekit-rust-sdks moved d0e27be0 ->
0a1c519c -- that rev is one of the seven `local *_COMMIT` values in src_prepare,
so pycargoebuild fixed GIT_CRATES but LIVEKIT_COMMIT had to be edited by hand;
left stale it would leave the four livekit [patch.crates-io] lines pointing at
git and break offline cargo. zed-reqwest also moved (c1566246 -> 33bc764a) but
carries no sed, being GIT_CRATES-only. WEBRTC_TAG in the new livekit rev is
still webrtc-0001d84-4, so WEBRTC_COMMIT is unchanged. All eleven sed patterns
verified at exactly one match against the new Cargo.toml, and all eight patches
applied clean with no rebase.
2026-09-01: second same-day bump (5e28272c 19:34 -> d3e54c97 19:59 UTC), so
-r1 again rather than a new date. Cargo.lock moved by only +2/-0 -- `ollama`
became a dependency of the workspace-local edit_prediction crate and `log` a
feature of wayland-backend -- so no crate version or source changed, and
pycargoebuild reproduced GIT_CRATES and the LICENSE block byte-identically.
It did drop scratch@1.0.9 from CRATES, and that is correct: upstream now
carries `[patch.crates-io] scratch = { path = "corgi-patches/scratch" }` (corgi
needs each crate to get its own OUT_DIR, which the published scratch bakes in at
build time), so the crate comes from the source tree and the CRATES entry had
been fetching an unused .crate ever since. No sed is needed for it -- the patch
is already a path.
Verified before publishing: the seven `local *_COMMIT` values all still resolve
against the new Cargo.lock, each of the eleven sed patterns matched the new
Cargo.toml exactly once, and running the eleven left zero [patch.crates-io]
entries pointing at git -- the check that the 08-20/08-23/08-25 defects failed.
All ten patches applied sequentially at fuzz zero (-F0); 0011, 0012 and 0002
carry line offsets only, so no rebase was needed. md5-cache _md5_ matches the
ebuild, and pkgcheck reports only the two findings the published ebuild already
had (deprecated llvm-r1, one over-long line in src_prepare).
2026-09-04: third same-day bump in a row (a7bc7d77 11:40 -> 5a9b9558 22:54
UTC), so -r1 rather than a new date; SRC_URI already names the tarball after
${PF}, so the DIST entry renames with it. This one was a MANUAL bump, so the
applier's 40-hex rewrite never ran and `grep -c` of EGIT_COMMIT gave 1, not 8.
Cargo.lock did move (13 commits, 45 files) but not in a way that touches deps:
diffing it with tomllib against the ebuild gave 0 missing / 0 extra registry
crates and 0 missing / 0 extra / 0 divergent git crates, and pycargoebuild
re-run from crates/zed left the file byte-identical (same md5) -- the two
WARNINGs it printed are what distinguishes that from a silent no-op run in the
virtual workspace root.
What did break was patch 0009. Upstream replaced AcpSession's `ref_count` with
a `Subscription` released via `cx.observe_release`, extracting the insert into
a new `register_session()`; both of 0009's `config_options.map(ConfigOptions::new)`
-> `config_options` sites lost their context and 2 of 10 hunks FAILED. Rebased
by regenerating with `git format-patch` from a corrected tree rather than by
hand-editing @@ counts: the new patch has the same shape (10 hunks, +59/-26),
so only the positions moved. After it, all fifteen patches apply sequentially
at zero fuzz and `ebuild ... prepare` completes.
Verified before publishing: eleven sed patterns each matched the new Cargo.toml
exactly once and left zero [patch.crates-io] entries on `git =`; the four
USE-flag seds produce valid TOML in all sixteen wayland/X/screen-capture/neovim
combinations; `cargo metadata --offline` resolves the whole graph (exit 0);
md5-cache _md5_ matches the ebuild; pkgcheck reports only the pre-existing
