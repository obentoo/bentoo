2026-09-06 (-r2): not an upstream move -- same commit 5a9b9558, revbumped only
because a sixteenth patch was added. 0018 makes a dropped folder open as its own
project, restoring the session saved for it, behind a new drop_folder_behavior
setting that defaults to the behaviour Zed already had. It is the first patch in
this series with NO USE flag: the default changes nothing for anyone who does
not set it, so gating it would only hide a setting behind a rebuild. In the
zed-patches series it sits UNGROUPED, ahead of the first "# @feature:" line.
Because SRC_URI renames the tarball after ${PF}, the -r2 needed its own DIST
entry; the distfile was copied from the -r1 rather than refetched, the two being
byte-identical (`cmp` clean) since the commit did not move.
2026-09-08 (-r1): the mirror image of the 08-20/08-23 defect, and the reason
those two entries are not enough on their own. This time the applier left the
seven `local *_COMMIT` values alone -- it did not rewrite them with EGIT_COMMIT
-- and the bump was still broken, because UPSTREAM moved one of them and nothing
re-derived it. 490aad88 (published as _pre20260908 at 06:41) switched
zed-industries/notify d842f16b <- 0890bbb8 in Cargo.lock and Cargo.toml, while
the ebuild kept 0890bbb8 in all three places it appears: the two GIT_CRATES rows
and NOTIFY_COMMIT in src_prepare. The failure is silent in the worst way -- the
sed anchors on `rev = "0890bbb8..."`, which no longer occurs, so it matches
nothing and exits 0 (a sed that does not match is not an error), leaving
notify/notify-types on `git =` for offline cargo to die on. Leaving the seven
alone is therefore NOT the safe state: they must be re-derived from Cargo.lock
on every bump, in both directions.
Verified before publishing: pycargoebuild re-run from crates/zed reproduced
CRATES byte-identically (1493 entries) and GIT_CRATES with exactly the two
notify rows differing, which is the whole of the fix; the Cargo.lock of
490aad88 and e2534d235 are byte-identical, so the CRATES half needed nothing.
After the fix both notify seds fire -- Cargo.toml lines 987/988 come out as
`path = "${WORKDIR}/notify-d842f16b.../..."` -- and work/notify-d842f16b exists.
All sixteen patches apply at zero fuzz through the real `ebuild ... prepare`
(>>> Source prepared), and `cargo check --offline` over the ten crates the
series touches (acp_thread agent agent_servers agent_ui claude_code_ide
feature_flags project settings settings_content workspace) finishes clean in
1m06, so nothing drifted at the API level either. Not merged with a build: this
host has no sudo, so no emerge ran.
2026-09-09: MANUAL bump, 72b02bf1 -> 5896274 (both 2026-09-09 UTC, so -r1). The
smallest bump this package has had: 2 commits, 10 files, and the Cargo.lock
untouched -- pycargoebuild reproduced CRATES (1493), GIT_CRATES (73) and the
LICENSE block byte-identically, and the regenerated Manifest changed exactly one
line, the source tarball's. The eleven sed patterns still resolve one-for-one
(11/11 came out `path =` against the real prepared tree), and the sixteen
patches refresh to a byte-identical series -- not merely applying, but with no
offset drift at all, which follows from the ten changed files intersecting
nothing the series touches.
Four ebuild changes rode along, none of them required by the bump:
  - pulseaudio DROPPED from IUSE. It changed no part of the build. Zed's audio
    path is cpal, which is ALSA on Linux; the lockfile carries alsa/alsa-sys and
    no libpulse crate at all, so the flag only added media-libs/libpulse to the
    depset. A PulseAudio sink is an alsa-plugins runtime choice.
  - inspector ADDED (upstream feature zed/inspector, the GPUI UI inspector).
  - remote-server ADDED: crates/remote_server, the SSH remote-editing daemon the
    client otherwise fetches from zed.dev onto the remote host at run time.
    Built from this workspace, not upstream's static musl target, so it needs
    this package's shared libraries; pkg_postinst spells out the ~/.zed_server
    naming the client requires.
