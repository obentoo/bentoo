series = '^[0-9.]+$'
version = "26.8.1"
comments = """
shotcut (stable channel) — tag "vX.Y.Z" ("v" stripped); releases/latest is the
stable release by definition, since it never returns a prerelease.

series matches on the ABSENCE of a suffix, not on a version prefix, exactly as
app-editors/zed-bin@stable does: the stable line advances 26.6 -> 26.8 -> …, so
a numeric pin would freeze this entry on one of them. It is not decoration.
The overlay carries shotcut-26.9.6_beta beside this one, and _beta sorts ABOVE
26.8.1; without the series the scan would return the beta as "current" and
every stable release below it would compare older and report "up to date" —
the stable line would silently stop updating. That is the failure measured on
zed-bin before its series was added.
"""
# END

["media-video/shotcut@beta"]
url = "https://api.github.com/repos/mltframework/shotcut/releases?per_page=20"
parser = "regex"
pattern = '"tag_name":"v([0-9.]+)","target_commitish":"[^"]*","name":"[^"]*","draft":false,"immutable":[a-z]+,"prerelease":true'
transform = [['$', "_beta"]]
select = "max"
headers = { "User-Agent" = "bentoo-autoupdate" }
series = '_beta$'
version = "26.9.6_beta"
comments = """
shotcut (beta channel) — the hard part here is that upstream gives the two
channels IDENTICAL tag shapes: "v26.8.1" is stable and "v26.9.6" is the beta,
both "vYY.M.D", no marker anywhere in the string. The only thing that tells
them apart is the GitHub "prerelease" boolean, so neither releases/latest (it
skips prereleases outright) nor a series over the version number can select
this channel. The pattern reads the flag instead.

It matches the flag through the release object's fixed field sequence
(tag_name, target_commitish, name, draft, immutable, prerelease) rather than
with a wildcard span, and that rigidity is the point: a lazy any-character
span between tag_name and prerelease WOULD cross record boundaries and pair
the stable tag_name with the NEXT release's prerelease=true — exactly the
reading that was wrong between 2026-08-01 and 2026-09-06, when the newest
release was the stable one. The API returns minified JSON on one line, so
there is no newline to anchor against either. If GitHub ever changes that
field order the record fails loudly with no match, which is the correct
failure: it reports nothing rather than the wrong channel.

transform appends the _beta suffix the overlay's PV carries; the ebuild strips
it back with MY_PV="${PV%_beta}" for SRC_URI, S and SHOTCUT_VERSION. series
then keeps this record on the beta ebuild, the mirror of the @stable entry.
Same two-channel arrangement as app-editors/zed-bin — read that record before
touching either half of this pair.
"""
# END

