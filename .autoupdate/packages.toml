transform = [['-stable', ""], ['-beta', "_beta"], ['-rc', "_rc"], ['-dev', "_alpha"]]
version = "4.8_alpha6-r1"
comments = """
godot — download archive lists newest first; transform the upstream suffix to
Gentoo form (-stable→bare, -beta→_beta, -rc→_rc, -dev→_alpha).
"""
# END

["dev-build/automake@1.19"]
enabled = false
disabled_by = "auto"
url = "https://ftp.gnu.org/gnu/automake/?C=M;O=D"
parser = "regex"
pattern = 'automake-([0-9][0-9.]*)\.tar\.xz'
select = "max"
series = '^1\.19(\.|$)'
version = "1.19"
comments = """
automake (1.19 line) — GNU FTP release dir, Apache listing with "?C=M;O=D"
(newest first); select = "max" is belt-and-braces in case the sort ever changes.

WHY THE SERIES PIN, AND WHY IT MUST NOT BE WIDENED: the ebuild derives its SLOT
from the version (MANGLED_SLOT=${PV:0:4}), so 1.19.1 stays in slot 1.19 and is
safe to auto-bump, while 1.20 would be a DIFFERENT slot. The applier renames the
ebuild in place — it never adds a second one — so an unpinned record would let a
1.20 release silently DELETE slot 1.19 instead of adding slot 1.20. This is the
same defect that erased dev-libs/icu-compat's slot on 2026-08-12. A new major
line gets a NEW record (@1.20) and a new ebuild, both by hand.

Prereleases (1.x.90+) live on alpha.gnu.org, not in this directory, so the
pattern cannot pick one up by accident.

bentoo carries this AHEAD of ::gentoo, which is still on 1.18.1. The ebuild is
additive (autotools.eclass is not overridden), so nothing regresses if the two
lines drift.
"""
# END

["dev-build/gn"]
hold = true
url = "https://deps.gentoo.zip/dev-build/gn/"
parser = "regex"
pattern = 'gn-([0-9][0-9.]*)\.tar\.xz'
select = "max"
version = "0.2540"
comments = """
gn — deps.gentoo.zip lists tarballs in ascending order; select=max picks the
highest (was SKIP: assumed git-only, but the mirror does host versioned tarballs).

hold = true ON PURPOSE, and the probe means the OPPOSITE of a bump signal.
Upstream publishes commits, never releases, so PV is 0.<count> from
`git describe ${GN_COMMIT} --abbrev=12 --match initial-commit` and somebody must
package the snapshot. This overlay generates and hosts its own (SRC_URI points at
distfiles.obentoo.org; the recipe and the pinned commit are in the ebuild), so a
bump is never a plain PV swap — the tarball has to be built and uploaded FIRST,
and an auto-bump would commit an ebuild whose SRC_URI 404s. Do not remove hold.

THE RETIRE CHECK IS MANUAL. Say plainly what hold costs, because the previous
wording promised a signal that cannot fire: a held record is SKIPPED by bulk
`--check`, so nothing here ever reaches the pending queue on its own. The one
invocation that would fire it, `--check dev-build/gn --force`, is unsafe on this
host — it enqueues into ~/.config/bentoo/autoupdate/pending.json, which an
external timer applies to the working tree, so the check would mutate the tree
it is checking. Reproduce the record's own fetch instead:

  curl -sS "https://deps.gentoo.zip/dev-build/gn/" \\
    | grep -oE 'gn-[0-9][0-9.]*\\.tar\\.xz' | sort -V | tail -1

WHEN: at every dev-build/gn bump (you are already in this package), and whenever
a chromium/dawn build needs a gn newer than the one hosted here.
WHAT IT MEANS: while that number is BELOW our PV, ::gentoo is still behind and
the self-hosting stays. Once it reaches or passes our PV, the self-hosting can be
retired — drop GN_COMMIT and the recipe, point SRC_URI back at deps.gentoo.zip,
and this record goes back to being an ordinary bump signal with hold removed.
LAST OBSERVED 2026-09-25: 0.2527 against our 0.2540 — vercmp = -1, still behind.
(0.2540 is the gn pinned by chromium-154 DEPS; 0.2501 lacked 664f3e63,
"Support public_inputs in group targets", which devtools-frontend needs.)
"""
# END

