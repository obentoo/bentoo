["app-backup/duplicati-bin"]
url = "https://api.github.com/repos/duplicati/duplicati/releases/latest"
parser = "json"
path = "tag_name"
transform = [['^v', ""], ['_.*', ""]]
headers = { "User-Agent" = "bentoo-autoupdate" }
aux_var = "MY_DATE"
aux_pattern = '_stable_([0-9]{4}-[0-9]{2}-[0-9]{2})'
version = "2.4.0.0"
comments = """
duplicati-bin — tag_name is "vX.Y.Z.W_<channel>_<YYYY-MM-DD>", e.g.
v2.3.0.4_stable_2026-07-09.  The transform strips the leading v and everything
from the first underscore, leaving the PV.

THE DATE IS LOAD-BEARING and is why aux_var exists here.  The ebuild rebuilds
both the tag and every asset name from MY_DATE:
    MY_TAG="v${PV}_${MY_CHANNEL}_${MY_DATE}"
    MY_ASSET="duplicati-${PV}_${MY_CHANNEL}_${MY_DATE}"
so an applier that moved PV alone would emit SRC_URI entries pointing at the
OLD release's date — a guaranteed 404, caught only at fetch time.  aux_pattern
runs against the raw response body, not the extracted version, which is what
lets it reach the date the path expression has already discarded.

MY_CHANNEL is left alone deliberately: it is "stable", and a channel change is
a decision, not a bump.  If upstream ever ships a non-stable release as latest,
this record starts extracting the wrong thing — check the channel before
applying a version whose date looks off.
"""
# END

