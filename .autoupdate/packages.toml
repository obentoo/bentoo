["media-libs/tlottie"]
hold = true
track = "commit"
url = "https://api.github.com/repos/dkaraush/tlottie/commits?sha=main&per_page=1"
parser = "json"
path = "[0].commit.committer.date"
transform = [['T.*', ""], ['-', ""]]
commit_sha_path = "[0].sha"
base_from = "file"
base_url = "https://raw.githubusercontent.com/dkaraush/tlottie/main/Cargo.toml"
base_pattern = '(?m)^version = "([0-9.]+)"'
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "0.1.0_pre20260911"
comments = """
tlottie — the Lottie renderer net-im/telegram-desktop links statically since the
7.2 series, replacing the bundled media-libs/rlottie. Upstream is a personal
repository with NO tags and NO releases, so the record is commit-tracked; the
base 0.1.0 comes from Cargo.toml, which is the only version string that exists.

hold = true is NOT a temporary state and must never be cleared as routine. The
correct commit is NOT the newest one on main — it is whatever
Telegram/build/prepare/prepare.py pins in the tdesktop release being packaged
(stage 'tlottie', `git checkout <sha>`; the same value appears in
Telegram/build/docker/centos_env/Dockerfile). The archive is linked statically
into the Telegram binary, so a drifting tlottie is an ABI change with no
soname to catch it. Measured 2026-09-08: main was already at 8ca87fc2 while
tdesktop 7.2.7 pinned 758c7cb7 — two days of drift, and an --apply would have
shipped it.

The probe is still live rather than absent because a record is a promise that
an endpoint answers, and both do: the commits API gives sha + committed date
for the _pre<YYYYMMDD> suffix, and raw Cargo.toml gives the base. What the hold
blocks is the apply, not the check.

Bumping, then, is driven by telegram-desktop and never by this record: read the
