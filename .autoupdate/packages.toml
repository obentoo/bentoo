    REVERSE against 9.12, i.e. the fix shipped upstream, so it was dropped.
    Probe every files/ patch with `patch -p1 -R --dry-run` on the new tarball
    before assuming it still belongs.
  - MY_PATCH, pinned at "${PN}-9.6-patches".  That is NOT a stale pin: no
    newer patchset exists on dev.gentoo.org/~sam/distfiles/sys-apps/coreutils/
    (9.10, 9.11 and 9.12 all 404), and ::gentoo pins 9.6 for the same reason.
    All four patches in it still apply cleanly to 9.12.  Re-probe on each bump;
    the tarball is default-on via `!vanilla?`, so a stale one is a build break,
    not a warning.

KEYWORDS are ALL ~arch here, unlike ::gentoo (amd64 arm64 ppc64 stable).  That
is deliberate: coreutils is @system and this version has not been exercised in
bentoo.  Raise them only with evidence, not on the next bump by habit.
"""
# END

