version = "8.10.2"
comments = """
redis/redis official Releases; tag is bare X.Y.Z (no "v"), matching the SRC_URI
archive tag and PV. Live latest=8.8.0 (prerelease=false) — the 8.x line, not a Valkey fork.

Removed 2026-09-07, revived 2026-09-17 -- and the revival is deliberate, not the
autoupdate resurrecting a disabled record by accident.

The 2026-09-07 removal had one reason: at 8.10.1 the ::gentoo ebuild had gained a
zstd USE flag the overlay copy never had, so at equal versions repo priority was
serving the poorer of the two. That reason is gone. The ebuild carried here now is
BYTE-IDENTICAL to ::gentoo's 8.10.1 (verified by diff on 2026-09-17; PV comes from
the filename), zstd included, and it sits one release ahead at 8.10.2.

So this was an ahead-of-::gentoo mirror, the same pattern as sys-apps/uutils and
app-arch/fakeroot: the overlay carries it only while ::gentoo lags. That block set
the exit condition as "DROP IT AGAIN the moment ::gentoo ships >=8.10.2", and it
was met the next morning -- see disabled_by above. Kept here because the record of
WHY it came back is what stops the same case being re-argued from scratch.
