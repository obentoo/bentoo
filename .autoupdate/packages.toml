GIMP — upstream publishes its own release index at gimp_versions.json, split
into STABLE / DEVELOPMENT arrays, newest first.  STABLE[0] therefore tracks the
stable LINE as well as the release: when 3.4 lands it becomes STABLE[0] on its
own, and SRC_URI already adapts because it interpolates
`mirror://gimp/v$(ver_cut 1-2)/`.  No `series` pin is needed, and none should be
added: it would freeze the record on 3.2 the day 3.4 ships.

Do NOT probe the download directory instead.  Two separate traps:
  - https://download.gimp.org/gimp/v3.2/ hardcodes the series, so it goes stale
    in SILENCE the day upstream opens v3.4 — the old dir keeps answering 200.
  - that host IGNORES the ?C=M;O=D query string (it is not Apache autoindex).
    Measured 2026-09-15: with the sort requested, the first match was still
    gimp-3.2.0.tar.xz.  The GNU-FTP idiom used by sys-apps/coreutils does NOT
    transfer here.

The JSON also carries the sha512 of each source tarball, which is worth using:
on the 3.2.6 import it matched the Manifest byte for byte, confirming the
distfile came from upstream and not from a mirror that had drifted.

This record is temporary, like the package.  bentoo mirrors gimp only while it
is AHEAD of ::gentoo (3.2.4 when 3.2.6 was imported, 2026-09-15).  Drop both
once ::gentoo ships 3.2.6.

A bump must re-diff the `*_minver` block of the upstream meson.build against
the previous release and move any floor that changed into COMMON_DEPEND -- the
applier only rewrites PV.  3.2.4 -> 3.2.6 moved exactly one: gdk_pixbuf_minver,
2.30.8 -> 2.32.0.
"""
# END

