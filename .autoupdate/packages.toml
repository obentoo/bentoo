["sci-ml/ollama"]
enabled = false
disabled_by = "removed 2026-09-25 (fifth time): ::gentoo ships the same 0.34.4 with the newer llama.cpp pin, ours was behind and named a patch that does not exist -- see comments"
url = "https://api.github.com/repos/ollama/ollama/releases/latest"
parser = "json"
path = "tag_name"
headers = { "User-Agent" = "bentoo-autoupdate" }
version = "0.34.4"
comments = """
ollama source — same repo as ollama-bin; tag "vX.Y.Z" (leading v stripped).

State as of 2026-09-16: the source ebuild is BACK, and the record is armed to
match. The overlay carries 0.34.0 and 0.34.1. Only 0.34.1 earns its keep --
::gentoo stops at 0.34.0, and our 0.34.0 is byte-identical to theirs, so that
one is a pruning candidate on the next sweep and not a divergence to defend.

How it got back matters, because it was not a decision: `autoupdate --revive
all` stripped this record's enabled = false and re-added the package on
2026-09-16. --revive is not selective -- it clears the flag on EVERY disabled
record, including the ones whose disable was the point (net-print/hplip-plugin
above came back in the same run). The re-add was kept on the maintainer's call,
and the Manifest and md5-cache were generated the same day to make the tree
consistent again.

Prior history, still the reason to read before bumping: 7cbe62f54 dropped
sci-ml/ollama-0.32.14 on 2026-08-19 because ::gentoo had caught up, the same
sweep that retired telegram-desktop, uutils-coreutils, mold and intel-microcode.
That removal was deliberate, unlike the one on 2026-07-30 when --clean swept the
whole directory (Manifest, metadata.xml and files/ included) by accident.
Earlier still: hold = true for the llama.cpp rearch that makes every bump
manual, then enabled = false from 2026-07-26, then enabled again on 2026-08-10
when sci-ml/ollama-0.32.6 was restored.

The llama.cpp tag is NOT free-form. It is read from LLAMA_CPP_VERSION, a
one-line file at the repo root, by llama/server/CMakeLists.txt — so the value
for a given release is raw.githubusercontent.com/ollama/ollama/v<PV>/
LLAMA_CPP_VERSION (v0.32.4 -> b10091; v0.32.6 and v0.32.7 both -> b10242). The
removed 0.32.3 ebuild carried LLAMA_CPP_tag=b10069 while its own release asked
for b10091; do not copy that value forward. It happened again anyway: 0.32.13
shipped carrying b10353 while its release asks for b10380, fixed in -r1 on
2026-08-16.

That stale tag is not cosmetic, because a second field moves with it. The
ebuild builds the vendored llama.cpp with LLAMA_USE_SYSTEM_GGML=ON, so the
DEPEND range on sci-ml/ggml has to bracket the ABI the pinned tag was written
against: ggml-0.20.0 added a trailing "int64_t K" to ggml_ssm_scan, which
b10380 still calls with eight arguments, and an uncapped >=sci-ml/ggml-0.17
let the solver pick 0.20.0 and fail the build (obentoo/bentoo#40). Every bump
therefore has THREE manual steps, none of which the applier performs: resync
LLAMA_CPP_tag from LLAMA_CPP_VERSION, diff ggml_ssm_scan (and its neighbours in
ggml/include/ggml.h) between the old tag and the new one, and move the
sci-ml/ggml ceiling to match. llama.cpp b10448 already carries the new arity,
so the ceiling opens up as soon as the pin reaches it.

That is exactly how ::gentoo settled it, and it is why nothing here needs the
ceiling any more: ollama-0.32.15 pins b10488, which calls ggml_ssm_scan with
nine arguments (ctx, s, x, dt, w, B, C, ids, /*K=*/1), and its DEPEND is a
FLOOR — >=sci-ml/ggml-0.20.0:= — not a ceiling. Users of this overlay resolve
to sci-ml/ollama-0.32.15::gentoo with sci-ml/ggml-0.20.2 and build fine. Should
the source ebuild ever return here, copy that shape instead of reintroducing
the cap: a floor tracks upstream, a ceiling has to be nursed on every bump.

SRC_URI also pulls ${P}-deps.tar.xz from github.com/gentoo-golang-dist/ollama,
a third-party repo that packages the Go dependencies roughly a day after
upstream tags (v0.32.6: upstream 2026-08-04 18:49Z, deps 2026-08-05 17:27Z).
Bumping on release day 404s on that file. Wait for the tag to appear; building
the tarball locally does not help, since SRC_URI would still 404 for everyone
else.

Then it came back. 90804e516 re-added sci-ml/ollama-0.33.2 and 0.33.3 on an
autoupdate run, because this record was still enabled: the note above said no
source ebuild should be here, but nothing enforced it. The resurrected ebuild
had exactly the defect this comment warns about -- LLAMA_CPP_tag=b10630 where
its own release asks for b10760 -- plus a ggml floor of 0.20.0 against
::gentoo's 0.23.0, which is the only ggml that exists. Removed again, and this
time enabled = false, which is the part that actually holds.

And then a third time, on 2026-09-16, which is what proves enabled = false is
NOT sufficient on its own. `bentoo overlay autoupdate --revive all` is not
selective: it clears enabled = false from every disabled record before probing,
so a flag set precisely to keep a package out is the flag that gets stripped.
It re-added 0.34.0 -- byte-identical to sci-ml/ollama-0.34.0::gentoo, zero
divergence -- and 0.34.1, carrying LLAMA_CPP_tag=b10760 while v0.34.1's own
LLAMA_CPP_VERSION file says b10864. Third resurrection, third stale pin, for
the reason written three paragraphs up: the applier bumps PV and nothing else.
Never run --revive with `all` against this overlay; name the package instead.

Fourth removal, 2026-09-22, and this one is not "::gentoo caught up" -- it is
"our copy is worse". Both trees carry 0.34.2. Ours pinned LLAMA_CPP_tag=b10760;
raw.githubusercontent.com/ollama/ollama/v0.34.2/LLAMA_CPP_VERSION answers
b10969, which is exactly what sci-ml/ollama-0.34.2::gentoo pins. That is the
same defect this comment has warned about since 0.32.3, now on its fourth
consecutive occurrence, and it recurs for the reason stated above: the applier
bumps PV and touches nothing else, so every resurrection re-inherits the
predecessor's pin. ::gentoo also renamed the cmake patch to ${P}-cmake.patch
while ours still named ${PN}-0.31.1-cmake.patch, and their DEPEND on sci-ml/ggml
is the floor shape recommended four paragraphs up.

The two dev-build/automake-1.19 and sec-keys/openpgp-keys-kamilaszewczyk
ebuilds went in the same commit, for the opposite reason -- there ::gentoo did
catch up -- and neither of those has a record here, so nothing had to be
disabled for them.

Fifth removal, 2026-09-25. It came back in 9b54e4c7c (2026-09-23) together
with net-print/hplip-plugin -- the --revive signature again -- and the
autoupdate then bumped it to 0.34.4 in 3d54e2b69. Same defect, now twice over:
LLAMA_CPP_tag=b10969 against ::gentoo's b11081, a ggml floor of 0.23.0 against
::gentoo's 0.25.3, and PATCHES naming ${P}-cmake.patch, which does not exist
in files/ (the applier renamed the reference, never the file), so the ebuild
died in src_prepare. gentoo-parity.sh reported it on its [missing] line.
::gentoo's 0.34.4 is strictly better and resolves against our sci-ml/ggml-0.25.3.

enabled = false has now failed four times against --revive all. It is set again
because it is the only switch the record model has, not because it holds.

