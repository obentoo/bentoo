["app-emulation/wine-vanilla"]
enabled = false
disabled_by = "auto"
url = "https://gitlab.winehq.org/api/v4/projects/wine%2Fwine/releases?per_page=30"
parser = "regex"
pattern = '"tag_name":"wine-([0-9]+\.[0-9]+(?:\.[0-9]+)?)"'
version = "11.15"
comments = """
wine-vanilla — upstream is GitLab (gitlab.winehq.org), not GitHub; the
wine-mirror/wine repo on GitHub is a read-only mirror. The releases endpoint is
used rather than repository/tags because only it is restricted to published
releases.

The closing quote in the pattern is load-bearing: release candidates DO appear
in this list (wine-11.0-rc1 .. rc5 are present today), so an unanchored
'wine-([0-9.]+)' would capture "12.0" from "wine-12.0-rc1" every January and
report a version whose tarball does not exist yet — dl.winehq.org publishes
wine-12.0-rc1.tar.xz, never wine-12.0.tar.xz, until the final release. Requiring
the quote makes an -rc tag fail to match, so during the rc window the first match
falls through to the last real release. Measured on the live body 2026-08-08:
"11.15" normally, still "11.15" with a synthetic wine-12.0-rc1 prepended, versus
"12.0" for the unanchored variant.

Version numbering has no third component in the development series (11.15); the
optional group covers the stable point releases (10.0.1, 9.0.1) that Wine issues
off a .0 branch.

Upstream ships a new development release every ~2 weeks. This overlay carries a
single version, deliberately one release ahead of ::gentoo, which held 11.14 on
the day 11.15 landed.
"""
# END

