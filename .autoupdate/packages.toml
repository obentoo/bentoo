["dev-libs/icu-compat"]
enabled = false
disabled_by = "pinned to the ICU 77 ABI www-client/orion-bin needs — NEVER auto-enable: SLOT derives from the version, so a bump deletes the slot instead of updating it (b165e5745)"
url = "https://api.github.com/repos/unicode-org/icu/releases/latest"
parser = "json"
path = "tag_name"
transform = [['^release-', ""], ['-', "."]]
version = "78.3"
comments = """
Pinned on purpose — do NOT enable. This package carries the ICU 77 ABI for
www-client/orion-bin, whose prebuilt WebKit imports u_*_77 symbols, while
dev-libs/icu covers the current one. SLOT is derived from the version
($(ver_cut 1)), so a bump does not update the package: it DELETES the slot.
That is not a hypothetical — b165e5745 (2026-08-12) bumped 77.1 → 78.3 and
emerge started answering `there are no ebuilds to satisfy "dev-libs/icu-compat:77"`.

Read this before touching version: `enabled = false` is documentation, not a
gate. A `bentoo overlay autoupdate --check dev-libs/icu-compat` arms the pending
queue anyway, and the applier that follows deletes this very line. If a probe
was run here, clear the entry from ~/.config/bentoo/autoupdate/pending.json by
hand, and after any `--apply all` check
`git diff .autoupdate/packages.toml | grep -- '-enabled = false'`.

The overlay now ships BOTH 77.1 (the ABI orion-bin needs) and 78.3. version
stays at 78.3 because it tracks the newest ebuild here, so the record does not
read as a pending bump if it is ever re-enabled. 78.3 is not installable while
::gentoo ships dev-libs/icu-78.3 — every file it carries belongs to that
package — so it declares `!!dev-libs/icu:0/78` and unblocks itself when ::gentoo
moves to 79. Needing a further ABI means adding a NEW version alongside these,
never renaming one of them.
"""
# END

