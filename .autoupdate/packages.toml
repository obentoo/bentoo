comments = """
fakeroot — developed inside Debian, with no upstream release page of its own.
Do NOT probe the pool listing (deb.debian.org/debian/pool/main/f/fakeroot/): it
is sorted alphabetically, so 1.37.1.1 appears before 2.1.4 and a first-match
regex would report the OLDER version as the newest.  sources.debian.org orders
versions newest first, versions[0] being sid/forky.  The transform strips the
Debian revision ("2.1.4-1" -> "2.1.4"), which is how the .orig.tar.xz in
SRC_URI is named.

This record is temporary, like the package: bentoo carries fakeroot only
because ::gentoo is stuck on 1.33 (2025).  Drop both once ::gentoo ships 2.x.
"""
