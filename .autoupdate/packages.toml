CC Switch — a Tauri GUI for switching between Claude Code, Codex and Gemini
CLI accounts. Tracks CC-Switch-v<PV>-Linux-{x86_64,arm64}.deb; note the asset
name carries a capitalised product name and a "v" before the version, unlike
most records here.

The .deb is used rather than the AppImage upstream also ships: same program,
12 MB against 88 MB, because the AppImage bundles a runtime this package gets
from the system (WebKitGTK 4.1, GTK+ 3, libsoup 3).

Upstream's desktop entry is broken in two ways that src_install repairs: the
file name contains a space, and Categories= is present but EMPTY. Re-check it
on a bump -- the fix asserts its own result, so an upstream change fails the
build instead of silently shipping an invalid entry.
"""
# END

["dev-util/gemini-cli"]
url = "https://registry.npmjs.org/@google/gemini-cli/latest"
parser = "regex"
pattern = '"version":"([0-9]+\.[0-9]+\.[0-9]+)"'
version = "0.61.0"
comments = """
Gemini CLI — probed on npm because GitHub publishes NO Linux artefact for it.
The release tags exist, but every asset is source; npm is the only channel
that ships the built bundle, so the npm version is the one this package can
actually follow.

Unlike cline and pnpm, the npm tarball here is NOT a wrapper around a
platform binary: it is a self-contained JavaScript bundle, which is why the
ebuild is architecture-independent and keeps ordinary ~amd64 ~arm64 keywords
instead of the "-*" used by the prebuilt packages.

node-pty and keytar are listed upstream as optional native bindings and are
deliberately not packaged -- the bundle was verified to run without them, and
each would need its own ebuild with a compiled component.
"""
# END

["dev-util/ccusage-bin"]
url = "https://registry.npmjs.org/@ccusage/ccusage-linux-x64/latest"
parser = "regex"
pattern = '"version":"([0-9]+\.[0-9]+\.[0-9]+)"'
type = "bin"
version = "20.0.24"
comments = """
ccusage — probed on the PER-PLATFORM npm package, not on the main "ccusage"
one and not on GitHub, and the distinction is load-bearing.

GitHub publishes no Linux asset at all. On npm the main "ccusage" package is a
20 KB wrapper that cannot run by itself: without its optional native
dependency it prints "ccusage native binary is not available for linux-x64"
and exits 1. The payload is @ccusage/ccusage-linux-{x64,arm64}, and that is
what this record follows -- so a version can never be claimed unless the
distfile the ebuild fetches actually exists at it.

The binary is static-pie and self-contained: no Node, no JS wrapper, so it
installs straight to /usr/bin. npm ships it mode 0644, hence doexe.
"""
# END

["dev-util/openchamber-bin"]
url = "https://api.github.com/repos/OpenChamber/openchamber/releases/latest"
parser = "regex"
pattern = '"tag_name":\s*"v([0-9]+\.[0-9]+\.[0-9]+)"'
headers = { "User-Agent" = "bentoo-autoupdate" }
type = "bin"
version = "2.0.1"
comments = """
OpenChamber — a desktop cockpit for parallel opencode sessions. Tracks
OpenChamber-<PV>-linux-{x86_64,arm64}.AppImage; the same release also carries
.apk/.aab (Android), .dmg/.zip (macOS), .exe (Windows), a .vsix and a web
tarball, so a bump must not drift onto those.

AppImage is the ONLY Linux artefact, and unpacker.eclass cannot read the
format, so src_unpack computes the squashfs offset from the ELF section header
table and feeds it to unsquashfs -- no execution of the downloaded file, and
no dependency on FUSE.

Two things src_prepare repairs, both asserted so an upstream change fails the
build rather than passing silently:

  * the AppImage bundles copies of system libraries (libXss, libXtst,
    libnotify, libappindicator, libgconf, libindicator) for portability. None
    appear in the binary's NEEDED list; only libnotify is referenced at all,
    via dlopen. They are removed and RDEPEND names the real packages -- which
    matters because libappindicator and libindicator do not exist in ::gentoo
    and would otherwise be silently shipped as vendored copies.

  * upstream's desktop entry runs "AppRun --no-sandbox". An AppImage has to
    disable the Chromium sandbox because it cannot ship a setuid helper; an
    installed package can, so chrome-sandbox goes in 4755 and the sandbox
    stays ON. Do not let a bump reintroduce --no-sandbox.
"""
# END

["sys-libs/libunwind@pinned"]
url = "https://api.github.com/repos/libunwind/libunwind/releases/latest"
parser = "json"
path = "tag_name"
transform = [["v", ""]]
headers = { "User-Agent" = "bentoo-autoupdate" }
series = '^1\.8\.3(-r[0-9]+)?$'
version = "1.8.3-r1"
comments = """
libunwind — a TRANSIENT fork of ::gentoo, not a package bentoo owns. The ebuild
is ::gentoo's libunwind-1.8.3 verbatim plus one extra patch, and the correct
end state is deleting this directory, never bumping it.

What it fixes: configure.ac substitutes UNW_CRT_LDFLAGS as "-WCClinker
-nostdlib". The libtool option is -XCClinker; with the wrong letter libtool
does not recognise it, passes it straight to gcc, and the link of libunwind.so
dies with "unrecognized command-line option '-WCClinker'". The branch is taken
whenever AC_SEARCH_LIBS has to add -lgcc_s for _Unwind_Resume, which under the
-nostdlib the test itself sets is always -- so ::gentoo's 1.8.3 cannot build on
amd64 at all with the --enable-cxx-exceptions the ebuild forces on every arch
for bug #418253. Upstream fixed it in 8e6a348b9 (post-1.8.3, unreleased).

::gentoo's own libunwind-1.8.3-typo.patch corrects a DIFFERENT typo in the same
AC_SEARCH_LIBS call (a stray -lc) and leaves -WCClinker untouched.

series pins the 1.8.3 line (revisions allowed, nothing else), and that is the
mechanism, not decoration. The probe can only say "up to date" or fail loudly
with "outside this entry's series"; it can never propose a bump. A bump is exactly the wrong move here: 1.8.4 will
carry the fix, so the patch would stop applying. When this check goes red, the
job is to delete sys-libs/libunwind from the overlay and let ::gentoo serve it
again -- the same applies the moment ::gentoo revbumps 1.8.3 with the fix, which
this probe cannot see.
"""
# END

["net-misc/wget2"]
url = "https://ftp.gnu.org/gnu/wget/"
parser = "regex"
pattern = 'wget2-([0-9]+(?:\.[0-9]+)+)\.tar\.gz"'
select = "max"
version = "2.3.0"
comments = """
wget2 -- probe the GNU FTP directory listing, which IS the SRC_URI source, not
the GitLab tag space. Upstream tags v2.3.0 and uploads the tarball separately;
a tag-based probe would propose a version whose mirror://gnu distfile does not
exist yet. The listing carries every historical release in name order, so
select = "max" is mandatory -- the first regex match is wget2-1.99.2.

The trailing quote in the pattern anchors on the href, keeping the .sig files
out of the match.
"""
# END
