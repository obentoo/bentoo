["www-misc/warsaw"]
url = "https://cloud.gastecnologia.com.br/bb/downloads/ws/debian/warsaw_setup64.run"
parser = "regex"
pattern = 'warsaw_([0-9.]+-[0-9]+)_amd64\.deb'
transform = [['-', "."]]
headers = { "Range" = "bytes=0-2097151" }
version = "2.21.5.1"
comments = """
Warsaw — banking security blob. The download URL is version-less
(warsaw_setup64.run), but the .run is a ZIP whose embedded Debian package name
"warsaw_<ver>-<rev>_amd64.deb" appears in plaintext ~590 KB in, so a regex over
the raw body recovers it. transform turns the "X.Y.Z-R" deb revision into the
ebuild's 4-segment PV (2.21.5-1 -> 2.21.5.1).

COST: this used to be the heaviest check in the file — the whole ~8.2 MB .run on
every run, 56% of all autoupdate traffic, intermittently blowing the per-request
deadline ("failed to read response body: context deadline exceeded", hit twice
on 2026-08-01). The Range header below fixes that; it needs bentoolkit >= 0.17.1,
where fetchContent accepts 206 alongside 200. On an older binary this record
fails with "HTTP request returned status 206" — drop the header if you must run
one.

The other cheap route was tried and IS a dead end, so do not re-try it: a lighter
sibling URL. The bucket does not list (200 with an empty body) and 403s every
probe — .sha256, .md5, version.txt, latest.txt, and even the versioned
warsaw_<ver>_amd64.deb itself. Only warsaw_setup64.run is public.

autoupdate.http_timeout in ~/.config/bentoo/config.yaml was raised above the 30 s
default purely to cover this package. With the Range in place the fetch measures
~0.9 s, so that raise can be reverted — after re-checking warsaw, not before.

The Range header is load-bearing, not an optimization: the full .run is ~8.2 MB
and reading all of it routinely blew the 30 s per-request deadline ("failed to
read response body: context deadline exceeded"). The host is S3 and advertises
"accept-ranges: bytes", so a 2 MiB partial GET returns 206 in under a second —
still a ~3.5x margin over the ~590 KB where the name sits, which is the ZIP's
local file header (the copy at EOF is the central directory, unreachable from
the head and not what we match). If upstream ever reorders the archive and the
name lands past 2 MiB, the check fails loudly rather than reading a stale value.
"""
# END

