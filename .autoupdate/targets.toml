# Interpreter implementations every package must offer when it uses the group.
#
# Read by `bentoo overlay targets` (the sweep) and by the `required-use` gate of
# `bentoo overlay autoupdate --apply`. A system whose PYTHON_SINGLE_TARGET holds
# only python3_15 cannot install a python-single-r1 package whose PYTHON_COMPAT
# omits it: REQUIRED_USE `^^ ( python_single_target_* )` is unsatisfiable and
# emerge stops before resolving anything.
#
# A group a package does not use is never checked. An exemption needs a reason,
# so the next sweep does not reopen the same investigation.

[required]
python_targets = ["python3_15"]
python_single_target = ["python3_15"]

# [[exempt]]
# atom = "category/package"
# groups = ["python_single_target"]
# reason = "upstream does not build on 3.15 yet: <link>; reopen when <condition>"
